<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Página</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

html,body{
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
}

#particles-js{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    z-index:0;
}

nav{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:70px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 50px;
    background:rgba(0,0,0,.4);
    backdrop-filter:blur(10px);
    z-index:100;
}

.logo{
    color:#8A2BE2;
    font-size:28px;
    font-weight:bold;
}

nav ul{
    display:flex;
    gap:35px;
    list-style:none;
}

nav ul li a{
    color:white;
    text-decoration:none;
    transition:.3s;
}

nav ul li a:hover{
    color:#8A2BE2;
}
</style>

</head>
<body>

<div id="particles-js"></div>

<nav>
    <div class="logo">LOGO</div>

    <ul>
        <li><a href="#">Inicio</a></li>
        <li><a href="#">Sobre mí</a></li>
        <li><a href="#">Proyectos</a></li>
        <li><a href="#">Contacto</a></li>
    </ul>
</nav>

<script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>

<script>
particlesJS("particles-js",{
    particles:{
        number:{
            value:100,
            density:{
                enable:true,
                value_area:800
            }
        },
        color:{
            value:"#8A2BE2"
        },
        shape:{
            type:"circle"
        },
        opacity:{
            value:0.5
        },
        size:{
            value:3
        },
        line_linked:{
            enable:true,
            distance:150,
            color:"#8A2BE2",
            opacity:0.5,
            width:1
        },
        move:{
            enable:true,
            speed:2
        }
    },
    interactivity:{
        events:{
            onhover:{
                enable:true,
                mode:"grab"
            },
            onclick:{
                enable:true,
                mode:"push"
            }
        },
        modes:{
            grab:{
                distance:180,
                line_linked:{
                    opacity:1
                }
            },
            push:{
                particles_nb:4
            }
        }
    },
    retina_detect:true
});
</script>

</body>
</html>
