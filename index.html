<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fondo Interactivo</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
}

#tsparticles{
    position:fixed;
    width:100%;
    height:100%;
    top:0;
    left:0;
    z-index:-1;
}
</style>
</head>
<body>

<div id="tsparticles"></div>

<script src="https://cdn.jsdelivr.net/npm/tsparticles@3/tsparticles.bundle.min.js"></script>

<script>
tsParticles.load("tsparticles", {
    background: {
        color: "#000000"
    },

    fpsLimit: 120,

    particles: {
        number: {
            value: 120
        },

        color: {
            value: "#8A2BE2"
        },

        links: {
            enable: true,
            distance: 150,
            color: "#8A2BE2",
            opacity: 0.6,
            width: 1
        },

        move: {
            enable: true,
            speed: 1.5
        },

        opacity: {
            value: 0.8
        },

        size: {
            value: {
                min: 1,
                max: 3
            }
        }
    },

    interactivity: {
        events: {
            onHover: {
                enable: true,
                mode: "grab"
            },

            onClick: {
                enable: true,
                mode: "push"
            }
        },

        modes: {
            grab: {
                distance: 200,
                links: {
                    opacity: 1
                }
            },

            push: {
                quantity: 4
            }
        }
    },

    detectRetina: true
});
</script>

</body>
</html>
