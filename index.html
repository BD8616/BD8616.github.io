<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fondo Interactivo</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }
<body>

<nav class="navbar">
    <div class="logo">Mi Sitio</div>

    <ul class="menu">
        <li><a href="#">Inicio</a></li>
        <li><a href="#">Sobre mí</a></li>
        <li><a href="#">Proyectos</a></li>
        <li><a href="#">Contacto</a></li>
    </ul>
</nav>
        html,
        body{
            width:100%;
            height:100%;
            background:#000000;
            overflow:hidden;
        }

        #particles-js{
            position:fixed;
            top:0;
            left:0;
            width:100%;
            height:100%;
        }
    </style>
</head>
<body>

<div id="particles-js"></div>

<script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>

<script>
particlesJS("particles-js",{
    "particles":{
        "number":{
            "value":120,
            "density":{
                "enable":true,
                "value_area":800
            }
        },
        "color":{
            "value":"#8A2BE2"
        },
        "shape":{
            "type":"circle"
        },
        "opacity":{
            "value":0.2
        },
        "size":{
            "value":3
        },
        "line_linked":{
            "enable":true,
            "distance":150,
            "color":"#8A2BE2",
            "opacity":0.2,
            "width":1
        },
        "move":{
            "enable":true,
            "speed":2,
            "out_mode":"out"
        }
    },
    "interactivity":{
        "detect_on":"canvas",
        "events":{
            "onhover":{
                "enable":true,
                "mode":"grab"
            },
            "onclick":{
                "enable":true,
                "mode":"push"
            },
            "resize":true
        },
        "modes":{
            "grab":{
                "distance":180,
                "line_linked":{
                    "opacity":1
                }
            },
            "push":{
                "particles_nb":4
            }
        }
    },
    "retina_detect":true
});
</script>

</body>
</html>
