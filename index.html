```html
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fondo Interactivo</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial, Helvetica, sans-serif;
}

#tsparticles{
    position:fixed;
    inset:0;
    z-index:-1;
}

nav{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:70px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 50px;
    background:rgba(0,0,0,.45);
    backdrop-filter:blur(10px);
    z-index:100;
}

.logo{
    color:#fff;
    font-size:28px;
    font-weight:bold;
}

nav ul{
    display:flex;
    gap:35px;
    list-style:none;
}

nav a{
    color:#fff;
    text-decoration:none;
    transition:.3s;
}

nav a:hover{
    color:#8A2BE2;
}
</style>

</head>
<body>

<div id="tsparticles"></div>

<nav>
    <div class="logo">Benjamin</div>

    <ul>
        <li><a href="#">Inicio</a></li>
        <li><a href="#">Sobre mí</a></li>
        <li><a href="#">Proyectos</a></li>
        <li><a href="#">CV</a></li>
    </ul>
</nav>

<script src="https://cdn.jsdelivr.net/npm/tsparticles@2/tsparticles.bundle.min.js"></script>

<script>
tsParticles.load("tsparticles",{

background:{
    color:"#000000"
},

fpsLimit:120,

particles:{

    number:{
        value:120
    },

    color:{
        value:"#8A2BE2"
    },

    links:{
        enable:true,
        distance:150,
        color:"#8A2BE2",
        opacity:0.45,
        width:1
    },

    move:{
        enable:true,
        speed:2
    },

    opacity:{
        value:0.6
    },

    size:{
        value:{min:2,max:4}
    }

},

interactivity:{

    events:{

        onHover:{
            enable:true,
            mode:["grab","repulse"]
        },

        onClick:{
            enable:true,
            mode:"push"
        }

    },

    modes:{

        grab:{
            distance:220,
            links:{
                opacity:1
            }
        },

        repulse:{
            distance:120,
            duration:0.4
        },

        push:{
            quantity:4
        }

    }

},

detectRetina:true

});
</script>

</body>
</html>
```
